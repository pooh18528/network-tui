[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-tui"
version = "2.6.0"
description = "Network scanner with Textual TUI + CLI — see users, devices and models on your LAN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["network", "scanner", "tui", "arp", "textual"]
dependencies = [
    "textual>=0.44.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
network-tui = "network_tui.cli:main"

[tool.setuptools.packages.find]
include = ["network_tui*"]
